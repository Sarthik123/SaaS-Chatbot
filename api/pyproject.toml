# Tool settings only. Dependencies are listed in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real Postgres (runs only when DATABASE_URL is set)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: basic errors, I: import order, B: common bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]
