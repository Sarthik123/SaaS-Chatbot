# Alembic = the tool that creates and changes database tables in small, numbered steps
# ("migrations"). Commands (run from the api/ folder, with DATABASE_URL set in .env):
#   alembic upgrade head      create / update the tables
#   alembic downgrade -1      undo the last step
#   alembic current           show which step the database is at
#
# The database address is NOT written here. migrations/env.py reads DATABASE_URL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
