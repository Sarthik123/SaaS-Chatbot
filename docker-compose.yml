# Local database for development: Postgres 16 with the pgvector add-on (search by meaning).
#   docker compose up -d db      start it
#   docker compose down          stop it (your data stays in the "pgdata" volume)
#   docker compose down -v       stop it AND delete the data
#
# The user/password below are throwaway values for this local container only.
# Real passwords (Neon, Render) live in environment variables, never in files.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, the first time the container creates an empty database.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
