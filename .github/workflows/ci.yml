name: CI

# Runs on every push and pull request. Nothing here calls a real AI service or needs a secret.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests + database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # A throw-away Postgres with pgvector, so the "integration" tests run for real in CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://support:support@localhost:5432/support_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # The real commands from the README, with the fake AI provider (no internet, no cost).
      - name: Migrate the database and ingest the demo articles twice
        env:
          LLM_PROVIDER: fake
        run: |
          alembic upgrade head
          python -m app.rag.ingest ../data/demo_kb
          python -m app.rag.ingest ../data/demo_kb

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
